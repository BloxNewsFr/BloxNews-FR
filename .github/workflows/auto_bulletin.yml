name: Auto bulletin Blox Fruits

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-bulletin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >
          curl -s
          "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY"
          | python3 -c
          "import json,sys; data=json.load(sys.stdin); [print(m['name']) for m in data.get('models',[]) if 'generateContent' in m.get('supportedGenerationMethods',[])]" || echo done
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-1.5-flash-latest
        run: python fetch_bulletin.py
      - name: Commit & push if changes
        run: |
          git config user.name  "bulletin-bot"
          git config user.email "bulletin-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "Auto : nouveau bulletin Blox Fruits"
            git push
          fi
