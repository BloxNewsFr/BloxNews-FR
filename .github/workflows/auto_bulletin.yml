name: Auto bulletin Blox Fruits

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures (UTC)
  workflow_dispatch:         # déclenchement manuel

permissions:
  contents: write            # nécessaire pour committer les nouveaux bulletins

concurrency:
  group: auto-bulletin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Run script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_bulletin.py --init

      - name: Commit & push if changes
        run: |
          git config user.name  "bulletin-bot"
          git config user.email "bulletin-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "Auto : nouveau bulletin Blox Fruits"
            git push
          fi
