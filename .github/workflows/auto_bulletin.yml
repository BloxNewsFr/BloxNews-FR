name: Auto bulletin Blox Fruits

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes
  workflow_dispatch:         # declenchement manuel

permissions:
  contents: write

concurrency:
  group: auto-bulletin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python fetch_bulletin.py

      - name: Commit & push if changes
        run: |
          git config user.name  "bulletin-bot"
          git config user.email "bulletin-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "Auto : nouveau bulletin Blox Fruits"
            git push
          fi
