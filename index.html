<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>News – Blox Fruits</title>
    <link rel="icon" type="image/png" href="./shared/favicon.png">
    <link rel="shortcut icon" href="./shared/bf_logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        @font-face { font-family: 'LuckiestGuy Regular'; src: url('./fonts/LuckiestGuy-Regular.ttf') format('truetype'); }
        :root { --color-text: #1a1a2e; --color-border: #e8e8f0; --color-primary: #ffda00; --color-accent: #175ec2; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* ── 3D LAYERED DEPTH SYSTEM ── */
        [data-depth] {
            will-change: translate, filter, opacity;
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
        }
        [data-depth="3"] { filter: brightness(1.08); }
        [data-depth="2"] { filter: brightness(1.04); }
        [data-depth="1"] { filter: brightness(1.01); }
        [data-depth="0"] { filter: brightness(0.97); opacity: 0.94; }
        [data-depth="-1"] { filter: blur(1.5px) brightness(0.92); opacity: 0.75; }
        [data-depth="-2"] { filter: blur(0.8px) brightness(0.96); opacity: 0.95; }
        body.scrolling [data-depth] { transition: filter 0s, opacity 0s; }
        body.scrolling [data-depth="-2"] { filter: blur(2px) brightness(0.9); opacity: 0.8; }
        body.scrolling [data-depth="-1"] { filter: blur(3px) brightness(0.85); opacity: 0.65; }
        body.scrolling [data-depth="0"]  { filter: blur(1px) brightness(0.94); opacity: 0.88; }
        
        body { font-family: 'Inter', sans-serif; color: var(--color-text); background-color: #f0f2f8; min-height: 100vh; }

        .site-background { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; pointer-events: none; }
        .site-background img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @media (max-width: 768px) { .site-background { display: none; } }

        /* ── NAVBAR LIQUID GLASS ── */
        .site-header {
            display: flex; align-items: center; justify-content: space-between; padding: 0 55px;
            position: sticky; top: 0; z-index: 1000; height: 72px;
            background-color: rgba(255, 255, 255, 0.08); background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
            background-size: 200% 100%; backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), backdrop-filter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .site-header__logo { cursor: pointer; }
        .site-header__logo img { height: 42px; width: auto; display: block; filter: none !important; }

        .site-nav { display: flex; gap: 8px; padding: 0; margin: 0; list-style: none; font-weight: 900; position: relative; z-index: 1; }
        .site-nav a, .site-header__icons { color: var(--color-text); transition: color 0.55s cubic-bezier(0.4, 0, 0.2, 1); }
        .site-header.nav-light-text .site-nav a, .site-header.nav-light-text .site-header__icons { color: #fff; -webkit-text-stroke: 1.2px rgba(0,0,0,0.7); text-shadow: 0 2px 8px rgba(0,0,0,0.35); }
        .site-nav a { text-decoration: none; font-size: 17px; text-transform: uppercase; font-family: 'LuckiestGuy Regular', cursive; padding: 8px 16px; border-radius: 10px; }
        .site-nav a:hover { background: var(--color-primary); color: #000; }
        .site-header__icons { display: flex; gap: 12px; cursor: pointer; align-items: center; position: relative; z-index: 1; }
        .site-header__icons span { padding: 8px; border-radius: 10px; transition: background 0.2s; }
        .site-header__icons span:hover { background: rgba(0,0,0,0.06); }
        .mobile-menu-btn, .mobile-nav-dropdown { display: none; }
        
        .main-content { max-width: 1240px; margin: 0 auto; padding: 40px 24px 80px; }
        .pagination-bar { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 36px; }
        .page-title { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,0.4); letter-spacing: -0.5px; }
        .blue-banner { display: inline-block; background: linear-gradient(135deg, #175ec2, #2980d4, #175ec2); background-size: 200% auto; color: #fff; padding: 16px 60px; font-size: 36px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; border-radius: 100px; font-family: 'LuckiestGuy Regular', cursive; box-shadow: 0 8px 32px rgba(23,94,194,0.45), 0 2px 8px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.2); }
        
        .pagination-controls { display: flex; align-items: center; gap: 16px; justify-content: center; width: 100%; }
        .pagination-controls button { background: rgba(255,255,255,0.95); border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: all 0.2s ease; color: #111; }
        .pagination-controls button:hover:not(:disabled) { background: var(--color-primary); transform: scale(1.12); box-shadow: 0 6px 20px rgba(255,218,0,0.5); }
        .pagination-controls button:disabled { background: rgba(255,255,255,0.3); color: rgba(255,255,255,0.4); cursor: not-allowed; box-shadow: none; }
        .pagination-info { font-size: 16px; font-weight: 700; color: #fff; min-width: 70px; text-align: center; text-shadow: 0 1px 8px rgba(0,0,0,0.5); background: rgba(0,0,0,0.25); padding: 6px 16px; border-radius: 100px; backdrop-filter: blur(10px); }
        
        /* GRID & CARDS */
        .news-grid { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
        .news-card { width: 360px; max-width: 100%; border-radius: 24px; overflow: hidden; position: relative; cursor: pointer; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease; display: flex; flex-direction: column; animation: fadeInUp 0.4s ease both; }
        .news-card:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 8px 20px rgba(0,0,0,0.12), 0 0 0 2px rgba(23,94,194,0.25); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .news-card__image-wrapper { width: 100%; padding-top: 58%; position: relative; background: #1a1a3e; border-radius: 24px 24px 0 0; }
        .news-card__image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .news-card:hover .news-card__image { transform: scale(1.08); }
        .news-card__image-wrapper::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0.5) 100%); pointer-events: none; }
        
        .news-card__badge { position: absolute; top: 14px; left: 14px; background: var(--color-primary); color: #000; font-weight: 900; font-size: 13px; padding: 5px 12px; border-radius: 100px; font-family: 'LuckiestGuy Regular', cursive; letter-spacing: 1px; z-index: 2; border: 2px solid rgba(255,255,255,0.6); }
        
        /* Bouton LIKES (Global sur toutes les cartes) */
        .post-like-btn {
            position: absolute; top: 14px; right: 14px; display: flex !important; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 6px 12px;
            border-radius: 30px; border: 2px solid #000; z-index: 10; cursor: pointer;
            box-shadow: 0 4px 0 #000; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px;
            color: #1a1a2e; transition: all 0.2s ease;
        }
        .post-like-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }
        .post-like-btn.liked { background: var(--color-primary); color: #000; }
        .post-like-btn.liked .material-symbols-outlined { font-variation-settings: 'FILL' 1; color: #ff0040; }
        .post-like-btn:hover { background: #f0f0f0; }
        .post-like-btn.liked:hover { background: #ffe833; }

        /* Badge Événement repositionné en dessous du badge principal à gauche */
        .news-card__new { position: absolute; top: 48px; left: 14px; background: linear-gradient(135deg, #ff4d4d, #ff0000); color: #fff; font-weight: 900; font-size: 11px; padding: 4px 10px; border-radius: 100px; font-family: 'Inter', sans-serif; letter-spacing: 1px; text-transform: uppercase; z-index: 2; animation: pulseBadge 2s ease-in-out infinite; }
        @keyframes pulseBadge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        
        .news-card__content { padding: 22px 22px 20px; display: flex; flex-direction: column; flex-grow: 1; background: #fff; border-radius: 0 0 24px 24px; }
        .news-card__eyebrow { font-size: 11px; font-weight: 700; color: var(--color-accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .news-card__title { font-size: 20px; font-weight: 900; color: #111; line-height: 1.25; margin-bottom: 16px; font-family: 'LuckiestGuy Regular', cursive; letter-spacing: 0.5px; }
        .news-card__button { margin-top: auto; align-self: flex-start; background: linear-gradient(135deg, #ffda00, #ffc200); color: #000; text-decoration: none; font-weight: 900; padding: 11px 24px; border-radius: 100px; font-size: 13px; text-transform: uppercase; transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(255,218,0,0.4); border: 2px solid rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        .news-card__button::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: left 0.4s ease; }
        .news-card:hover .news-card__button::before { left: 100%; }
        .news-card:hover .news-card__button { background: linear-gradient(135deg, #ffe833, #ffda00); box-shadow: 0 6px 25px rgba(255,218,0,0.6); transform: translateX(3px); }
        .news-card__bar { height: 4px; background: linear-gradient(90deg, var(--color-accent), #5b9bd5, var(--color-primary)); background-size: 200% auto; }
        
        .pagination-bottom { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 50px; }
        .pagination-bottom button { background: rgba(255,255,255,0.95); border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: all 0.2s ease; color: #111; }
        .pagination-bottom button:hover:not(:disabled) { background: var(--color-primary); transform: scale(1.12); box-shadow: 0 6px 20px rgba(255,218,0,0.5); }
        .pagination-bottom button:disabled { background: rgba(255,255,255,0.3); color: rgba(255,255,255,0.4); cursor: not-allowed; box-shadow: none; }

        .mobile-pagination-pill { display: none; }

        /* ── MODAL UI ── */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 99999; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background: #fff; border: 4px solid #000; border-radius: 20px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close { position: absolute; top: 15px; right: 15px; background: #ff0040; color: #fff; border: 2px solid #000; border-radius: 50%; width: 35px; height: 35px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 10; transition: transform 0.2s; }
        .modal-close:hover { transform: scale(1.1); background: #cc0033; }
        .modal-header { background: var(--color-primary); border-bottom: 4px solid #000; padding: 20px; }
        .modal-section { font-family: 'Inter', sans-serif; font-weight: 900; text-transform: uppercase; background: #000; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; display: inline-block; }
        .modal-title { font-family: 'LuckiestGuy Regular', sans-serif; font-size: 32px; margin: 10px 0 0 0; color: #000; letter-spacing: 1px; }
        .modal-body { padding: 20px; }
        .modal-body img { width: 100%; border-radius: 12px; border: 2px solid #000; display: block; }
        .modal-info { margin-top: 20px; background: #f4f4f5; padding: 15px; border-radius: 12px; border: 2px solid #e8e8f0; }
        .modal-info h3 { font-family: 'LuckiestGuy Regular', sans-serif; margin-bottom: 10px; font-size: 20px; }

        /* RESPONSIVE MOBILE */
        @media (max-width: 768px) { 
            .site-header { padding: 0 20px; height: auto; min-height: 60px; } 
            .site-nav { display: none; } 
            .mobile-menu-btn { display: block; }
            .news-grid { gap: 20px; padding: 0 12px; } 
            .news-card { width: 100%; border-radius: 20px; } 
            .blue-banner { font-size: 24px; padding: 12px 30px; margin: 12px 0 8px; } 
            .page-title { font-size: 28px; margin: 16px 0 8px; padding: 0 12px; }
            .pagination-controls, .pagination-bottom { display: none !important; }

            .mobile-nav-dropdown {
                display: flex; flex-direction: column; gap: 12px;
                position: fixed; top: 60px; right: -280px; width: 250px;
                background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
                padding: 24px; border-radius: 0 0 0 20px; box-shadow: -5px 10px 30px rgba(0,0,0,0.1);
                transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 999; border: 1px solid rgba(0,0,0,0.05); border-right: none;
            }
            .mobile-nav-dropdown.is-open { right: 0; }
            .mobile-nav-dropdown a {
                text-decoration: none; font-family: 'LuckiestGuy Regular', cursive; font-size: 18px;
                color: #111; text-align: center; padding: 12px; border-radius: 100px; border: 2px solid #e8e8f0;
                text-transform: uppercase; transition: all 0.2s;
            }
            .mobile-nav-dropdown a.active { background: #175ec2; color: #fff; border-color: transparent; }

            .mobile-pagination-pill {
                display: flex !important; position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 9999;
                background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
                border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 22px; border-radius: 100px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.12);
                gap: 18px; align-items: center; transition: background 0.4s cubic-bezier(0.4,0,0.2,1), border-color 0.4s cubic-bezier(0.4,0,0.2,1);
            }
            .mobile-pagination-pill button { background: transparent; border: none; color: #fff; font-size: 20px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; flex-shrink: 0; }
            .mobile-pagination-pill button:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
            .mobile-pagination-pill button:disabled { opacity: 0.25; cursor: default; }
            .mobile-pagination-pill .page-info { color: #fff; font-weight: 900; font-size: 15px; min-width: 48px; text-align: center; font-family: 'Inter', sans-serif; transition: color 0.4s cubic-bezier(0.4,0,0.2,1); }
            .mobile-pagination-pill.is-light { background: rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.3); }
            .mobile-pagination-pill.is-light button, .mobile-pagination-pill.is-light .page-info { color: #000 !important; }
        }

        /* ── TOUT LE RESTE DU CSS (Spécial Cards Glitch, Halloween, Fire, Water, Ice...) EST INCLUS ── */
        .news-card.glitch-card, .news-card.valentine-card { isolation: isolate; }
        .news-card.glitch-card .news-card__image-wrapper, .news-card.glitch-card .news-card__content, .news-card.glitch-card .news-card__bar, .news-card.halloween-card .news-card__image-wrapper, .news-card.halloween-card .news-card__content, .news-card.halloween-card .news-card__bar, .news-card.valentine-card .news-card__image-wrapper, .news-card.valentine-card .news-card__content, .news-card.valentine-card .news-card__bar { position: relative; z-index: 2; }
        .news-card.glitch-card { background: #020402; border: 2px solid #00ff41; box-shadow: 0 0 24px rgba(0,255,65,0.7), 0 0 60px rgba(0,255,65,0.22), 0 18px 46px rgba(0,0,0,0.55); animation: fadeInUp 0.4s ease both, glitch-card-surge 2.8s steps(1) infinite; }
        .news-card.glitch-card::before { content: ""; position: absolute; inset: 0; z-index: 8; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,255,65,0.16) 0 1px, transparent 1px 4px), linear-gradient(90deg, transparent 0 42%, rgba(255,0,88,0.16) 43% 45%, transparent 46% 67%, rgba(0,140,255,0.16) 68% 70%, transparent 71%); mix-blend-mode: screen; animation: glitch-scan 4s linear infinite; }
        .news-card.glitch-card .news-card__image { filter: sepia(1) hue-rotate(82deg) saturate(420%) contrast(150%) brightness(0.86); transform: scale(1.12); animation: glitch-image-break 1.55s steps(1) infinite; }
        .news-card.glitch-card:hover .news-card__image { transform: scale(1.18); }
        .news-card.glitch-card .news-card__image-wrapper { background: #001100; }
        .news-card.glitch-card .news-card__badge, .news-card.glitch-card .news-card__new { background: #000; color: #00ff41; border-color: #00ff41; box-shadow: 0 0 18px rgba(0,255,65,0.85); font-family: 'Share Tech Mono', monospace; }
        .news-card.glitch-card .news-card__new { color: #ff355d; border-color: #ff355d; animation: glitch-label-blink 1.2s steps(1) infinite; }
        .news-card.glitch-card .news-card__content { background: linear-gradient(180deg, #031006, #000); border-top: 1px solid rgba(0,255,65,0.6); }
        .news-card.glitch-card .news-card__eyebrow, .news-card.glitch-card .news-card__title { color: #00ff41; font-family: 'Share Tech Mono', monospace; text-shadow: 2px 0 #ff0058, -2px 0 #00a2ff, 0 0 14px #00ff41; animation: glitch-text-break 0.28s steps(2) infinite alternate; }
        .news-card.glitch-card .news-card__button { background: #000; color: #00ff41; border-color: #00ff41; border-radius: 10px; box-shadow: 0 0 18px rgba(0,255,65,0.62); font-family: 'Share Tech Mono', monospace; }
        .news-card.glitch-card:hover .news-card__button { background: #00ff41; color: #000; box-shadow: 0 0 28px #00ff41; }
        .news-card.glitch-card .news-card__bar { background: linear-gradient(90deg, #00ff41, #ff0058, #00a2ff, #00ff41); }

        .news-card.halloween-card { background: #0d0500; border: 2px solid rgba(255,106,0,0.7); box-shadow: 0 0 0 1px rgba(255,140,0,0.06) inset, 0 0 38px rgba(255,106,0,0.9), 0 0 85px rgba(200,50,0,0.44), 0 30px 80px rgba(0,0,0,0.75); }
        .news-card.halloween-card .news-card__image-wrapper { background: #0d0500; border-radius: 22px 22px 0 0; }
        .news-card.halloween-card .news-card__image { filter: sepia(0.15) hue-rotate(340deg) saturate(250%) contrast(140%) brightness(0.7); transform: scale(1.1); transition: filter 0.4s ease, transform 0.5s ease; }
        .news-card.halloween-card:hover .news-card__image { filter: sepia(0.1) hue-rotate(345deg) saturate(320%) contrast(155%) brightness(0.9); transform: scale(1.19) rotate(-0.5deg); }
        .news-card.halloween-card .news-card__badge, .news-card.halloween-card .news-card__new { background: rgba(13, 5, 0, 0.93); color: #ff8c00; border: 1px solid rgba(255, 106, 0, 0.7); box-shadow: 0 0 22px rgba(255, 106, 0, 0.9), inset 0 0 10px rgba(255, 60, 0, 0.1); backdrop-filter: blur(8px); }
        .news-card.halloween-card .news-card__content { background: radial-gradient(circle at 86% 10%, rgba(255, 80, 0, 0.19), transparent 36%), radial-gradient(circle at 12% 85%, rgba(200, 40, 0, 0.12), transparent 32%), linear-gradient(180deg, #1a0800, #0d0500); border-top: 1px solid rgba(255, 106, 0, 0.6); }
        .news-card.halloween-card .news-card__eyebrow { color: #ff8c00; text-shadow: 0 0 12px rgba(255, 106, 0, 0.85); }
        .news-card.halloween-card .news-card__title { color: #ffb060; text-shadow: 0 0 22px rgba(255,106,0,1), 0 0 55px rgba(200,50,0,0.7), 2px 0 rgba(100,30,0,0.5), -2px 0 rgba(255,160,0,0.4); }
        .news-card.halloween-card .news-card__button { background: linear-gradient(135deg, #4a1500, #cc5500 52%, #6a2000); color: #ffb060; border: 1px solid rgba(255, 106, 0, 0.6); }
        .news-card.halloween-card:hover .news-card__button { background: linear-gradient(135deg, #ff6a00, #cc4400 50%, #881100); color: #fff; box-shadow: 0 0 44px rgba(255, 106, 0, 1), 0 0 92px rgba(200, 50, 0, 0.56); }
        .news-card.halloween-card .news-card__bar { background: linear-gradient(90deg,#cc4400,#ff6a00,#ff8c00,#ff5500,#cc4400); height: 5px; }

        .news-card.valentine-card { background: linear-gradient(155deg,#1a0008 0%,#400015 40%,#180008 100%); border: 2px solid rgba(255,55,95,0.72); box-shadow: 0 0 0 1px rgba(255,145,175,0.15) inset, 0 0 35px rgba(255,38,88,0.78), 0 0 78px rgba(202,0,58,0.36), 0 28px 80px rgba(82,0,28,0.66); }
        .news-card.valentine-card .news-card__image-wrapper { background: #200008; border-radius: 22px 22px 0 0; }

        .news-card.fire-card { background: radial-gradient(ellipse at 50% 105%, rgba(30,80,0,0.35) 0%, transparent 45%), linear-gradient(170deg, #010800 0%, #021200 40%, #000c00 100%); border: 2px solid rgba(57,255,20,0.72); box-shadow: 0 0 0 1px rgba(57,255,20,0.1) inset, 0 0 52px rgba(57,255,20,0.75), 0 0 110px rgba(20,200,0,0.38), 0 30px 80px rgba(0,0,0,0.82); }

        .news-card.fire-card:hover .news-card__image { filter: brightness(1.05) contrast(1.06); transform: scale(1.19); }
        .news-card.fire-card .news-card__badge, .news-card.fire-card .news-card__new { background: rgba(0,6,0,0.96); color: #7aff40; border: 1px solid rgba(57,255,20,0.78); box-shadow: 0 0 22px rgba(57,255,20,0.92), inset 0 0 8px rgba(57,255,20,0.12); }
        .news-card.fire-card .news-card__content { background: radial-gradient(ellipse at 50% 0%, rgba(57,255,20,0.14) 0%, transparent 48%), linear-gradient(180deg, #031200 0%, #010800 100%); border-top: 1px solid rgba(57,255,20,0.65); }
        .news-card.fire-card .news-card__eyebrow { color:#7aff40; text-shadow:0 0 10px rgba(57,255,20,0.88); }

        .news-card.fire-card .news-card__bar { background:linear-gradient(90deg,#002200,#39ff14,#c8ff80,#39ff14,#002200); height:5px; }

        .news-card.water-card { background: linear-gradient(168deg, #00080f 0%, #001525 42%, #000610 100%); border: 2px solid rgba(55,180,255,0.58); box-shadow: 0 0 42px rgba(0,165,255,0.52), 0 30px 80px rgba(0,0,0,0.8); }
        .news-card.water-card .news-card__image-wrapper { background: linear-gradient(180deg, #000810 0%, #000610 100%); border-radius: 22px 22px 0 0; }
        .news-card.water-card .news-card__image { filter: brightness(0.9) contrast(1.04); transform: scale(1.08); }
        .news-card.water-card:hover .news-card__image { filter: brightness(1.06) contrast(1.06); transform: scale(1.18); }
        .news-card.water-card .news-card__badge, .news-card.water-card .news-card__new { background: rgba(0,6,18,0.95); color: #66d8ff; border: 1px solid rgba(0,180,255,0.74); box-shadow: 0 0 22px rgba(0,180,255,0.88); }
        .news-card.water-card .news-card__content { background: linear-gradient(180deg, #001320 0%, #000810 100%); border-top: 1px solid rgba(0,180,255,0.48); }
        .news-card.water-card .news-card__eyebrow { color:#66d8ff; text-shadow:0 0 10px rgba(0,180,255,0.82); }
        .news-card.water-card .news-card__title { color:#a8eaff; text-shadow:0 0 22px rgba(0,180,255,0.92); }
        .news-card.water-card .news-card__button { background:linear-gradient(135deg,#001222,#002e4a 52%,#001828); color:#66d8ff; border:1px solid rgba(0,180,255,0.68); }
        .news-card.water-card:hover .news-card__button { background:linear-gradient(135deg,#0088cc,#00b4ff 52%,#006699); color:#000; box-shadow:0 0 46px rgba(0,180,255,1); }
        .news-card.water-card .news-card__bar { background:linear-gradient(90deg,#002e50,#00b4ff,#80dcff,#00b4ff,#002e50); height:5px; }

        .news-card.ice-card { background: linear-gradient(168deg, rgba(0,8,24,0.96) 0%, rgba(0,14,38,0.93) 30%, rgba(0,20,50,0.91) 55%); border: 2px solid rgba(155,225,255,0.68); box-shadow: 0 0 48px rgba(110,205,255,0.65), 0 30px 80px rgba(0,0,0,0.85); backdrop-filter: blur(2px); }
        .news-card.ice-card .news-card__image-wrapper { background: linear-gradient(180deg, #000a1e 0%, #000816 100%); border-radius: 22px 22px 0 0; }
        .news-card.ice-card .news-card__image { filter: brightness(0.88) contrast(1.05); transform: scale(1.08); }
        .news-card.ice-card:hover .news-card__image { filter: brightness(1.04) contrast(1.06); transform: scale(1.18); }
        .news-card.ice-card .news-card__badge, .news-card.ice-card .news-card__new { background: rgba(0,6,20,0.92); color: #b2e4ff; border: 1px solid rgba(155,225,255,0.74); box-shadow: 0 0 22px rgba(110,205,255,0.88); }
        .news-card.ice-card .news-card__content { background: linear-gradient(180deg, rgba(0,12,30,0.88) 0%, rgba(0,8,22,0.9) 100%); border-top: 1px solid rgba(155,225,255,0.48); }
        .news-card.ice-card .news-card__eyebrow { color:#8dd4ff; text-shadow:0 0 10px rgba(155,225,255,0.88); }
        .news-card.ice-card .news-card__title { color:#c4ecff; text-shadow:0 0 24px rgba(155,225,255,0.98); }
        .news-card.ice-card .news-card__button { background: linear-gradient(135deg, rgba(0,12,32,0.9), rgba(0,22,56,0.85) 52%, rgba(0,12,32,0.9)); color:#92dcff; border:1px solid rgba(155,225,255,0.68); }
        .news-card.ice-card:hover .news-card__button { background: linear-gradient(135deg, #0077cc, #55bbff 52%, #0066aa); color:#000; box-shadow:0 0 46px rgba(155,225,255,1); }
        .news-card.ice-card .news-card__bar { background:linear-gradient(90deg,#001635,#80d8ff,#caeeff,#80d8ff,#001635); height:5px; }

        @keyframes glitch-scan{0%{background-position:0 0,0 0}100%{background-position:0 220px,120px 0}}
        @keyframes glitch-image-break{ 0%,14%,20%,63%,100%{transform:scale(1.12);filter:sepia(1) hue-rotate(82deg) saturate(420%) contrast(150%) brightness(.86)} 15%{transform:translateX(8px) skewX(-8deg) scale(1.18);filter:invert(1) hue-rotate(180deg) contrast(220%)} 17%{transform:translateX(-8px) skewX(8deg) scale(1.16);filter:sepia(1) hue-rotate(120deg) saturate(520%) contrast(220%)} 64%{transform:translateY(-5px) scale(1.2);filter:brightness(2.4) contrast(260%)} 66%{transform:translateY(3px) scale(1.1)} }
        @keyframes glitch-label-blink{0%,55%,100%{opacity:1}56%,62%{opacity:0}63%,66%{opacity:1}}
        @keyframes glitch-text-break{ 0%{transform:translate(0,0);text-shadow:2px 0 #ff0058,-2px 0 #00a2ff,0 0 14px #00ff41} 50%{transform:translate(1px,-1px);text-shadow:-3px 0 #ff0058,3px 0 #00a2ff,0 0 18px #00ff41} 100%{transform:translate(-1px,1px)} }
        @keyframes glitch-card-surge { 0%,100%{box-shadow:0 0 24px rgba(0,255,65,.7),0 0 60px rgba(0,255,65,.22),0 18px 46px rgba(0,0,0,.55)} 18%{box-shadow:0 0 34px rgba(255,0,88,.82),0 0 70px rgba(0,255,65,.26),0 18px 46px rgba(0,0,0,.55)} 19%{box-shadow:0 0 28px rgba(0,162,255,.82),0 0 70px rgba(0,255,65,.26),0 18px 46px rgba(0,0,0,.55)} 48%{border-color:#ff0058}49%{border-color:#00ff41} }
    </style>
</head>
<body>

    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <filter id="water-surface" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.015 0.025" numOctaves="2" result="waveNoise" seed="3">
                <animate attributeName="baseFrequency" values="0.015 0.025;0.018 0.029;0.013 0.022;0.016 0.027;0.015 0.025" dur="14s" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="waveNoise" scale="8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="site-background">
        <picture>
            <source media="(min-width: 769px)" srcset="./shared/fond_bulletinpng.png">
            <img src="./shared/fond_bulletinpng.png" alt="Background">
        </picture>
    </div>

    <header class="site-header">
        <div class="site-header__logo" ondblclick="toggleAdminEditMode()"><img src="./BF_news.png" alt="Blox Fruits"></div>
        <nav>
            <ul class="site-nav">
                <li><a href="https://www.roblox.com/fr/games/2753915549/Blox-Fruits">Game</a></li>
                <li><a href="./index.html" class="nav-news">News</a></li>
                <li><a href="./neo_bulletin.html" class="nav-leaks">Leaks</a></li>
            </ul>
        </nav>
        <div class="site-header__icons">
            <span class="material-symbols-outlined">search</span>
            <span class="material-symbols-outlined">person</span>
            <span class="material-symbols-outlined mobile-menu-btn" id="menuToggle">menu</span>
        </div>
    </header>

    <div class="mobile-nav-dropdown" id="mobileNav">
        <a href="https://www.roblox.com/fr/games/2753915549/Blox-Fruits">Game</a>
        <a href="./index.html" class="nav-news active" style="background:#175ec2; color:#fff; border-color:transparent;">News</a>
        <a href="./neo_bulletin.html" class="nav-leaks">Leaks</a>
    </div>

    <main class="main-content">
        <div class="pagination-bar">
            <div class="blue-banner">Blox News</div>
            <div class="pagination-controls">
                <button id="prev-top" onclick="changePage(-1)" disabled>←</button>
                <span class="pagination-info" id="page-info-top">1 / 4</span>
                <button id="next-top" onclick="changePage(1)">→</button>
            </div>
        </div>
        
        <div class="news-grid" id="news-grid"></div>
        
        <div class="pagination-bottom">
            <button id="prev-bot" onclick="changePage(-1)" disabled>←</button>
            <span class="pagination-info" id="page-info-bot">1 / 4</span>
            <button id="next-bot" onclick="changePage(1)">→</button>
        </div>

        <div class="mobile-pagination-pill" id="pagination-mobile">
            <div class="pill-switcher">
                <a href="./index.html" class="active" onclick="return slideTo('./index.html',event)">News</a>
                <a href="./neo_bulletin.html" onclick="return slideTo('./neo_bulletin.html',event)">Leaks</a>
            </div>
            <div class="pill-divider"></div>
            <button id="prev-mobile" onclick="changePage(-1)">←</button>
            <span class="page-info" id="page-info-mobile">1 / 4</span>
            <button id="next-mobile" onclick="changePage(1)">→</button>
        </div>
    </main>

    <div id="imageInfoModal" class="modal-overlay" onclick="if(event.target===this) closeImageModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeImageModal()">✕</button>
            <div class="modal-header">
                <span class="modal-section" id="modalSection">Section</span>
                <h2 class="modal-title" id="modalTitle">Titre de la pastille</h2>
            </div>
            <div class="modal-body">
                <img id="modalImage" src="" alt="Aperçu">
                <div class="modal-info">
                    <h3>Informations</h3>
                    <div id="modalDescription">Description ici...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bulletins = [
            { num: "001", img: "./001/img/img_fruit.png",          href: "./001/bulletin-001.html" },
            { num: "002", img: "./002/img/1th_img.png",            href: "./002/bulletin-002.html" },
            { num: "003", img: "./003/img/1th_img.png",            href: "./003/bulletin-003.html" },
            { num: "004", img: "./004/img/1th_img.png",            href: "./004/bulletin-004.html" },
            { num: "005", img: "./005/img/bloxyNews1.png",         href: "./005/bulletin-005.html" },
            { num: "006", img: "./006/img/Thumbnail1Woohoo.png",   href: "./006/bulletin-006.html" },
            { num: "007", img: "./007/img/IndraCover.png",         href: "./007/bulletin-007.html" },
            { num: "008", img: "./008/img/ZiolesAuraFarm.png",     href: "./008/bulletin-008.html" },
            { num: "009", img: "./009/img/duel.png",               href: "./009/bulletin-009.html" },
            { num: "010", img: "./010/img/RipVSRed.png",           href: "./010/bulletin-010.html" },
            { num: "011", img: "./011/img/bulletin011cover.png",   href: "./011/bulletin-011.html" },
            { num: "012", img: "./012/img/hack.png",               href: "./012/bulletin-012.html" },
            { num: "013", img: "./013/img/BrokenShip.png",         href: "./013/bulletin-013.html" },
            { num: "014", img: "./014/img/rocket.png",             href: "./014/bulletin-014.html" },
            { num: "015", img: "./015/img/darkblade.png",          href: "./015/bulletin-015.html" },
            { num: "016", img: "./016/img/kraken.png",             href: "./016/bulletin-016.html" },
            { num: "017", img: "./017/img/halloween.png",          href: "./017/bulletin-017.html" },
            { num: "018", img: "./018/img/MysteryMan.png",         href: "./018/bulletin-018.html" },
            { num: "019", img: "./019/img/Mygame.png",             href: "./019/bulletin-019.html" },
        ];
        const PER_PAGE = 6;
        let currentPage = 1;
        const totalPages = Math.ceil(bulletins.length / PER_PAGE);
        
        const specialCards = {
            "012": { className: "glitch-card", badge: "#012", status: "HACK", eyebrow: "Terminal compromis", title: "BULLETIN #012", button: "Accéder au terminal" },
            "015": { className: "fire-card", badge: "#015", status: "", eyebrow: "The Blox Bulletin", title: "BULLETIN #015", button: "Lire maintenant →" },
            "016": { className: "water-card", badge: "#016", status: "", eyebrow: "The Blox Bulletin", title: "BULLETIN #016", button: "Lire maintenant →" },
            "017": { className: "halloween-card", badge: "#017", status: "HALLOWEEN", eyebrow: "Halloween Event", title: "BULLETIN #017", button: "Ouvrir la porte" },
            "018": { className: "ice-card", badge: "#018", status: "", eyebrow: "The Blox Bulletin", title: "BULLETIN #018", button: "Lire maintenant →" },
            "019": { className: "valentine-card", badge: "#019", status: "SAINT-VALENTIN", eyebrow: "Saint-Valentin", title: "BULLETIN #019", button: "Lire la lettre" }
        };

        // ── LOGIQUE DES LIKES (Local Storage) ──
        function toggleLike(id, btn) {
            let likes = JSON.parse(localStorage.getItem('bf_likes_count') || '{}');
            let userLiked = JSON.parse(localStorage.getItem('bf_user_liked') || '{}');
            
            if (userLiked[id]) {
                userLiked[id] = false;
                likes[id] = Math.max(0, (likes[id] || 1) - 1);
                btn.classList.remove('liked');
            } else {
                userLiked[id] = true;
                likes[id] = (likes[id] || 0) + 1;
                btn.classList.add('liked');
            }
            
            localStorage.setItem('bf_likes_count', JSON.stringify(likes));
            localStorage.setItem('bf_user_liked', JSON.stringify(userLiked));
            btn.querySelector('.like-count').textContent = likes[id];
        }

        function initLikes() {
            let likes = JSON.parse(localStorage.getItem('bf_likes_count') || '{}');
            let userLiked = JSON.parse(localStorage.getItem('bf_user_liked') || '{}');
            document.querySelectorAll('.post-like-btn').forEach(btn => {
                let id = btn.getAttribute('data-id');
                btn.querySelector('.like-count').textContent = likes[id] || 0;
                if(userLiked[id]) {
                    btn.classList.add('liked');
                }
            });
        }

        // ── LOGIQUE MODAL D'IMAGE ──
        function openImageModal(imgSrc, tagTitle, sectionName, descriptionHTML) {
            document.getElementById('modalImage').src = imgSrc;
            document.getElementById('modalTitle').textContent = tagTitle;
            document.getElementById('modalSection').textContent = sectionName;
            document.getElementById('modalDescription').innerHTML = descriptionHTML;
            document.getElementById('imageInfoModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        function closeImageModal() {
            document.getElementById('imageInfoModal').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        // ── MODE D'ÉDITION MAGIC COMMAND ──
        function toggleAdminEditMode() {
            if (document.designMode === "on") {
                document.designMode = "off";
                alert("🔒 Mode Édition DÉSACTIVÉ.");
            } else {
                document.designMode = "on";
                alert("✏️ Mode Édition ACTIVÉ. Tu peux maintenant cliquer sur n'importe quel texte pour le modifier visuellement !");
            }
        }

        function renderPage() {
            const grid = document.getElementById("news-grid");
            const start = (currentPage - 1) * PER_PAGE;
            const slice = bulletins.slice(start, start + PER_PAGE);
            
            grid.innerHTML = slice.map((b, i) => {
                const special = specialCards[b.num] || {};
                
                // IMPORTANT : Plus de "Nouveau" automatique ici, uniquement les status comme HACK ou HALLOWEEN
                const statusLabel = special.status || "";

                return `<article class="news-card ${special.className || ""}" onclick="window.location='${b.href}'">
                    <button class="post-like-btn" data-id="${b.num}" onclick="event.stopPropagation(); toggleLike('${b.num}', this)">
                        <span class="material-symbols-outlined" style="font-size:18px;">favorite</span>
                        <span class="like-count">0</span>
                    </button>
                    <div class="news-card__image-wrapper">
                        <img src="${b.img}" class="news-card__image" alt="Bulletin #${b.num}">
                        <div class="news-card__badge">${special.badge || `#${b.num}`}</div>
                        ${statusLabel ? `<div class="news-card__new">${statusLabel}</div>` : ""}
                    </div>
                    <div class="news-card__content">
                        <div class="news-card__eyebrow">${special.eyebrow || "The Blox Bulletin"}</div>
                        <h2 class="news-card__title">${special.title || `Bulletin #${b.num}`}</h2>
                        <a href="${b.href}" class="news-card__button" onclick="event.stopPropagation()">${special.button || "Lire maintenant →"}</a>
                    </div>
                    <div class="news-card__bar"></div>
                </article>`;
            }).join("");

            // Mise à jour de la pagination
            const info = `${currentPage} / ${totalPages}`;
            document.getElementById("page-info-top").textContent = info;
            document.getElementById("page-info-bot").textContent = info;
            document.getElementById("page-info-mobile").textContent = info;

            document.getElementById("prev-top").disabled = currentPage === 1;
            document.getElementById("next-top").disabled = currentPage === totalPages;
            document.getElementById("prev-bot").disabled = currentPage === 1;
            document.getElementById("next-bot").disabled = currentPage === totalPages;
            document.getElementById("prev-mobile").disabled = currentPage === 1;
            document.getElementById("next-mobile").disabled = currentPage === totalPages;

            // Charger les likes sur la page
            initLikes();
        }

        function changePage(dir) {
            currentPage += dir;
            renderPage();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        
        renderPage();

        // Menu Mobile Toggle
        const menuBtn = document.getElementById('menuToggle');
        const mobileNav = document.getElementById('mobileNav');
        if (menuBtn && mobileNav) {
            menuBtn.addEventListener('click', () => {
                mobileNav.classList.toggle('is-open');
                menuBtn.textContent = mobileNav.classList.contains('is-open') ? 'close' : 'menu';
            });
        }
    </script>
</body>
</html>
